#
# Toolchain declaration for befunge93-vault-cracker.
# Declared below: bun, deno, pnpm, just, shellcheck, trivy, zig.
#
# NOT declared: idris2. The `%default total` ABI typecheck in `.github/workflows/ci.yml`
# needs it, but it is deliberately absent here rather than pinned to something that
# does not resolve -- the Ubuntu `apt` archive no longer ships it, and no mise backend
# for it has been validated against this repository. CI provisions it out-of-band.
# Both that provisioning and the `befunge93-vault-cracker.ipkg` module-path mismatch
# are tracked as `v0.5.0` items in ROADMAP.adoc; do not "fix" this comment by adding
# an `idris2 = "latest"` line that cannot actually install.
#
# Canon: hyperpolymath/standards 3-practice/provisioning/PROVISIONING-STANDARD.adoc
# and 3-practice/LANGUAGE-POLICY.adoc §1.4 (Bun > Deno > pnpm from one package.json).
# No banned tools (python, node, npm, yarn, go, java, make, nix) appear here.

[settings]
lockfile = true

[tools]
bun = "latest"
deno = "latest"
pnpm = "latest"
just = "latest"
shellcheck = "latest"
trivy = "latest"
zig = "latest"
