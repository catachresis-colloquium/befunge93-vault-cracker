#
# Toolchain declaration for befunge93-vault-cracker (bun, zig, idris2).
# Canon: hyperpolymath/standards 3-practice/provisioning/PROVISIONING-STANDARD.adoc
# and 3-practice/LANGUAGE-POLICY.adoc §1.4 (Bun > Deno > pnpm from one package.json).
# No banned tools (python, node, npm, yarn, go, java, make, nix) appear here.

[settings]
lockfile = true

[tools]
bun = "latest"
deno = "latest"
pnpm = "latest"
just = "latest"
shellcheck = "latest"
trivy = "latest"
zig = "latest"
