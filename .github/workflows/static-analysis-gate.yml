# SPDX-License-Identifier: MPL-2.0
# Static Analysis Gate — Dedicated CI/CD jobs for `panic-attack` ("panic-attacker")
# and `pons-asinorum` ("pons assinum" / Euclid I.5 multi-language static scanner).
name: Static Analysis — panic-attack & pons-asinorum

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PANIC_ATTACK_SHA: b689a74d2762a1c19839ae3fbd59b7fe5ef920ea
  PONS_SHA: 32e55677d8fd1f3010848dee22e822c2f385c2a0

jobs:
  panic-attack:
    name: panic-attack assail
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore panic-attack build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.panic-attack
          key: panic-attack-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PANIC_ATTACK_SHA }}

      - name: Build or restore pinned panic-attack
        id: pa-install
        run: |
          set -euo pipefail
          root="$HOME/.panic-attack"
          bin="$root/bin/panic-attack"
          if [ -x "$bin" ] && grep -qF "#$PANIC_ATTACK_SHA" "$root/.crates.toml" 2>/dev/null; then
            echo "Restored panic-attack at $PANIC_ATTACK_SHA"
          else
            timeout 600 cargo install --git https://github.com/hyperpolymath/panic-attack \
              --rev "$PANIC_ATTACK_SHA" --locked --force --root "$root" panic-attack
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Run panic-attack assail
        env:
          PA_BIN: ${{ steps.pa-install.outputs.bin }}
        run: |
          set -euo pipefail
          report="$(mktemp)"
          "$PA_BIN" assail . --output "$report"
          jq --arg ref "$PANIC_ATTACK_SHA" '
            [.weak_points[] | select(.suppressed != true) | .severity] as $s
            | {status: "ran", tool: "panic-attack", ref: $ref,
               counts: {critical: ($s | map(select(. == "Critical")) | length),
                        high: ($s | map(select(. == "High")) | length),
                        medium: ($s | map(select(. == "Medium")) | length),
                        low: ($s | map(select(. == "Low")) | length)},
               report: .}' "$report" > panic-attack-findings.json
          critical="$(jq '.counts.critical' panic-attack-findings.json)"
          high="$(jq '.counts.high' panic-attack-findings.json)"
          medium="$(jq '.counts.medium' panic-attack-findings.json)"
          low="$(jq '.counts.low' panic-attack-findings.json)"
          {
            echo "## panic-attack assail"
            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| Critical | $critical |"
            echo "| High     | $high |"
            echo "| Medium   | $medium |"
            echo "| Low      | $low |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$critical" -gt 0 ]; then
            echo "::error::panic-attack reported $critical critical weak point(s)"
            exit 1
          fi

      - name: Upload panic-attack findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: panic-attack-findings
          path: panic-attack-findings.json
          if-no-files-found: ignore

  pons-asinorum:
    name: pons-asinorum scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore pons-asinorum build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pons
          key: pons-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PONS_SHA }}

      - name: Build or restore pinned pons-asinorum
        id: pons-install
        run: |
          set -euo pipefail
          root="$HOME/.pons"
          bin="$root/bin/pons"
          if [ -x "$bin" ] && grep -qF "#$PONS_SHA" "$root/.crates.toml" 2>/dev/null; then
            echo "Restored pons at $PONS_SHA"
          else
            timeout 600 cargo install --git https://github.com/hyperpolymath/pons-asinorum \
              --rev "$PONS_SHA" --locked --force --root "$root" pons-cli
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Run pons-asinorum scan
        env:
          PONS_BIN: ${{ steps.pons-install.outputs.bin }}
        run: |
          set -euo pipefail
          report="$(mktemp)"
          if "$PONS_BIN" scan --help 2>&1 | grep -q -- '--format'; then
            "$PONS_BIN" scan --format json . > "$report"
            jq --arg ref "$PONS_SHA" '{status: "ran", tool: "pons-asinorum", ref: $ref, report: .}' "$report" > pons-findings.json
          else
            "$PONS_BIN" scan . | tee "$report"
            jq -n --arg ref "$PONS_SHA" --rawfile output "$report" \
              '{status: "ran", tool: "pons-asinorum", ref: $ref, text_report: $output}' > pons-findings.json
          fi
          {
            echo "## pons-asinorum scan"
            echo ""
            echo "Scanned repository with \`hyperpolymath/pons-asinorum@$PONS_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pons-asinorum findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: pons-asinorum-findings
          path: pons-findings.json
          if-no-files-found: ignore
